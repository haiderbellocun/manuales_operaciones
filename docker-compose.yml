services:
  postgres:
    image: postgres:16-alpine
    container_name: acervo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: acervo
      POSTGRES_PASSWORD: acervo_dev
      POSTGRES_DB: acervo
    ports:
      - "5433:5432"
    volumes:
      - acervo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acervo -d acervo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  acervo_pgdata:
